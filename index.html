<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homeschool Hub & AI Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA0Fhd_pSeouiugfanada4tbfifRG_WlPe",
      authDomain: "homeschooltracker-7d824.firebaseapp.com",
      projectId: "homeschooltracker-7d824",
      storageBucket: "homeschooltracker-7d824.firebasestorage.app",
      messagingSenderId: "799363312180",
      appId: "1:799363312180:web:3966dd42d5119d630bb861",
      measurementId: "G-R6K2GTMM29"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.changeChild = function() { loadData(); }

    window.logAttendanceCloud = async function() {
      let child = document.getElementById("child-select").value;
      let today = new Date().toLocaleDateString();
      try {
        await addDoc(collection(db, "attendance"), { child: child, date: today, timestamp: new Date() });
        alert(`Attendance logged for ${child}!`);
        loadData();
      } catch (e) { alert("Error: " + e.message); }
    };

    window.saveLessonPlan = async function() {
      let child = document.getElementById("child-select").value;
      let subject = document.getElementById("lesson-subject").value;
      let details = document.getElementById("lesson-details").value;
      let status = document.getElementById("lesson-status").value;

      if(!details) { alert("Please enter or generate lesson details."); return; }

      try {
        await addDoc(collection(db, "lessons"), { 
          child: child, 
          subject: subject, 
          details: details, 
          status: status, // "Draft" or "Assigned"
          timestamp: new Date() 
        });
        alert(`Lesson saved to ${child}'s profile as [${status}]!`);
        document.getElementById("lesson-details").value = "";
        loadData();
      } catch (e) { alert("Error: " + e.message); }
    }

    async function loadData() {
      let child = document.getElementById("child-select").value;
      
      // Load Attendance
      try {
        const q = query(collection(db, "attendance"), where("child", "==", child));
        const querySnapshot = await getDocs(q);
        let days = [];
        querySnapshot.forEach((doc) => { days.push(doc.data().date); });

        document.getElementById("days-count").innerText = days.length;
        let percent = Math.min(Math.round((days.length / 180) * 100), 100);
        document.getElementById("progress-percent").innerText = percent + "%";
        document.getElementById("progress-bar").style.width = percent + "%";

        let listEl = document.getElementById("attendance-list");
        if (days.length > 0) {
          listEl.innerHTML = days.map(d => `<li class="py-1 flex justify-between text-xs"><span>📅 ${d}</span> <span class="text-emerald-600 font-semibold">Present</span></li>`).join('');
        } else {
          listEl.innerHTML = `<li class="py-1 text-slate-400 italic text-xs">No attendance logged yet for ${child}.</li>`;
        }
      } catch (e) { console.error(e); }

      // Load Saved Lessons for Selected Child Only
      try {
        const q2 = query(collection(db, "lessons"), where("child", "==", child));
        const querySnapshot2 = await getDocs(q2);
        let lessons = [];
        querySnapshot2.forEach((doc) => { lessons.push({ id: doc.id, ...doc.data() }); });

        let lessonEl = document.getElementById("lesson-list");
        if (lessons.length > 0) {
          lessonEl.innerHTML = lessons.map(l => `
            <li class="py-2 border-b border-slate-100 flex justify-between items-start">
              <div>
                <div class="flex items-center space-x-2">
                  <span class="font-bold text-indigo-600 text-xs">[${l.subject}]</span>
                  <span class="text-[10px] px-2 py-0.5 rounded-full ${l.status === 'Assigned' ? 'bg-emerald-100 text-emerald-700 font-bold' : 'bg-slate-100 text-slate-500'}">${l.status}</span>
                </div>
                <p class="text-xs text-slate-600 mt-1 whitespace-pre-line">${l.details}</p>
              </div>
            </li>
          `).join('');
        } else {
          lessonEl.innerHTML = `<li class="py-2 text-slate-400 italic text-xs">No lessons logged yet for ${child}.</li>`;
        }
      } catch (e) { console.error(e); }
    }

    loadData();
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4">
  <div class="max-w-2xl mx-auto space-y-6">
    <!-- Header & Child Selector -->
    <header class="bg-indigo-600 text-white p-4 rounded-xl shadow space-y-3">
      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold">Homeschool Hub</h1>
        <select id="child-select" onchange="changeChild()" class="bg-indigo-700 text-white font-semibold px-3 py-1 rounded-lg text-sm border border-indigo-400 focus:outline-none">
          <option value="Child 1">Child 1 (8th Grade)</option>
          <option value="Child 2">Child 2 (2nd Grade)</option>
        </select>
      </div>
      <div class="flex justify-between items-center pt-2 border-t border-indigo-500">
        <p class="text-xs text-indigo-200">State: Indiana (180 Day Target)</p>
        <button onclick="logAttendanceCloud()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs transition">
          + Log Today's Attendance
        </button>
      </div>
    </header>

    <!-- Progress Cards -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-white p-4 rounded-xl shadow border border-slate-100">
        <span class="text-xs font-semibold text-slate-400 uppercase">Days Completed</span>
        <div class="text-3xl font-extrabold text-indigo-600 mt-1" id="days-count">0</div>
        <p class="text-xs text-slate-500 mt-1">Goal: 180 Days</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow border border-slate-100">
        <span class="text-xs font-semibold text-slate-400 uppercase">Year Progress</span>
        <div class="text-3xl font-extrabold text-emerald-600 mt-1" id="progress-percent">0%</div>
        <div class="w-full bg-slate-200 h-2 rounded-full mt-2 overflow-hidden">
          <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>
    </div>

    <!-- AI Lesson Plan & Curriculum Builder -->
    <div class="bg-white rounded-xl shadow border border-slate-100 p-4 space-y-3">
      <h2 class="font-bold text-md text-indigo-900">✨ Lesson & Quiz Manager</h2>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] text-slate-400 font-bold uppercase">Subject</label>
          <select id="lesson-subject" class="w-full bg-slate-100 border border-slate-300 text-xs rounded-lg p-2">
            <option>Math</option>
            <option>Science</option>
            <option>Language Arts</option>
            <option>History / Social Studies</option>
            <option>Quiz / Test</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] text-slate-400 font-bold uppercase">Visibility Status</label>
          <select id="lesson-status" class="w-full bg-slate-100 border border-slate-300 text-xs rounded-lg p-2">
            <option value="Draft">Draft (Only Parent Sees)</option>
            <option value="Assigned">Assigned (Active Today)</option>
          </select>
        </div>
      </div>

      <textarea id="lesson-details" placeholder="Paste AI lesson plans, notes, or quiz questions here..." class="w-full h-24 text-xs p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      
      <button onclick="saveLessonPlan()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg text-xs transition">
        Save Lesson / Quiz to Selected Child's Profile
      </button>
    </div>

    <!-- Records Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-white rounded-xl shadow border border-slate-100 p-4">
        <h3 class="font-bold text-sm mb-2 text-slate-700">Attendance Log</h3>
        <ul id="attendance-list" class="divide-y divide-slate-100">
          <li class="py-1 text-slate-400 italic text-xs">Loading...</li>
        </ul>
      </div>
      <div class="bg-white rounded-xl shadow border border-slate-100 p-4">
        <h3 class="font-bold text-sm mb-2 text-slate-700">Child's Curriculum & Quizzes</h3>
        <ul id="lesson-list" class="max-h-48 overflow-y-auto">
          <li class="py-2 text-slate-400 italic text-xs">Loading...</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
